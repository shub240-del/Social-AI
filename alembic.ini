[alembic]
script_location = migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally EMPTY.
#
# It previously hardcoded:
#   postgresql+asyncpg://socialai_user:socialai_secret_dev_pass@localhost:5432/socialai_dev
# which (a) committed credentials and (b) meant a production `alembic upgrade head`
# would silently target localhost instead of the real database.
#
# migrations/env.py MUST now resolve the URL from the environment. Required change
# in migrations/env.py (this repo's env.py was not available to patch directly):
#
#     import os
#     from alembic import context
#     url = os.environ.get("MIGRATION_DATABASE_URL") or os.environ["DATABASE_URL"]
#     config.set_main_option("sqlalchemy.url", url)
#
# Using os.environ[...] rather than .get() is deliberate: an unset URL must raise
# at migration time, not fall through to a default.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
