[project]
name = "socialai"
version = "1.0.0"
description = "Social AI — AI social media content platform (API)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "gunicorn==23.0.0",
    "pydantic[email]==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "aiosqlite==0.20.0",
    "pyjwt[crypto]==2.10.1",
    "passlib==1.7.4",
    "bcrypt==4.2.1",
    "cryptography==49.0.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
# Error monitoring is optional: the app degrades to log-only if absent.
monitoring = ["sentry-sdk[fastapi]==2.19.2"]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# An explicit list of top-level names installs only those directories and
# silently drops every subpackage, so the discovery directive is required.
[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*"]
exclude = ["tests*", "migrations*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes these files; reformatting them by hand only lasts until the
# next `alembic revision --autogenerate`.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented pattern.
