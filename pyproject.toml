[tool.poetry]
name = "socialai-platform"
version = "1.0.0"
description = "AI Social Media Content Platform Backend Microservices"
authors = ["Engineering Team <engineering@socialai.io>"]
readme = "README.md"
packages = [
    { include = "packages" },
    { include = "services" }
]

# Every entry below is imported by code in this repository. Versions match
# what the test and verification suites were actually run against.
[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.128.0"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
gunicorn = "^26.0.0"
pydantic = {extras = ["email"], version = "^2.12.5"}
pydantic-settings = "^2.14.2"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.51"}
alembic = "^1.18.5"
asyncpg = "^0.31.0"              # async driver used by the application
psycopg2-binary = "^2.9.12"      # sync driver used by alembic migrations
aiosqlite = "^0.22.1"            # sqlite fallback for local dev and tests
bcrypt = "^5.0.0"
pyjwt = {extras = ["crypto"], version = "^2.13.0"}
cryptography = "^49.0.0"
httpx = "^0.28.1"                # runtime: NVIDIA API client
sentry-sdk = {extras = ["fastapi"], version = "^2.66.1", optional = true}

[tool.poetry.extras]
monitoring = ["sentry-sdk"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
ruff = "^0.4.4"
black = "^24.4.2"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG"]
ignore = ["B008", "N818", "UP042", "E501", "UP046", "UP007", "ARG001", "ARG002", "E721", "A002"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=packages --cov=services"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
asyncio_mode = "auto"
