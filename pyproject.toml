[tool.poetry]
name = "socialai-platform"
version = "1.0.0"
description = "AI Social Media Content Platform Backend Microservices"
authors = ["Engineering Team <engineering@socialai.io>"]
readme = "README.md"
packages = [
    { include = "packages" },
    { include = "services" }
]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.7.1"
pydantic-settings = "^2.2.1"
asyncpg = "^0.29.0"
sqlalchemy = "^2.0.30"
alembic = "^1.13.1"
redis = "^5.0.4"
temporalio = "^1.6.0"
google-genai = "^0.1.1"
openai = "^1.30.1"
anthropic = "^0.26.1"
pinecone-client = "^3.2.2"
clickhouse-connect = "^0.7.7"
opentelemetry-api = "^1.24.0"
opentelemetry-sdk = "^1.24.0"
opentelemetry-instrumentation-fastapi = "^0.45b0"
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
hvac = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
ruff = "^0.4.4"
black = "^24.4.2"
mypy = "^1.10.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG"]
ignore = ["B008", "N818", "UP042", "E501", "UP046", "UP007", "ARG001", "ARG002", "E721", "A002"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=packages --cov=services"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
asyncio_mode = "auto"
