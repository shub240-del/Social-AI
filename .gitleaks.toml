# Extends the gitleaks default ruleset.
# The default ruleset has no rule for the provider token formats this project
# uses, so they are declared explicitly below.
[extend]
useDefault = true

[[rules]]
id = "sakana-api-key"
description = "Sakana AI (console.sakana.ai) API key"
# Observed format: a "fish_" prefix followed by 64 hex characters.
regex = '''fish_[A-Fa-f0-9]{48,}'''
keywords = ["fish_"]

# Retained after the migration away from NVIDIA: the key that leaked in
# .env.production is still reachable in git history, so history scans must keep
# matching it until that history is rewritten.
[[rules]]
id = "nvidia-api-key"
description = "NVIDIA NIM / build.nvidia.com API key (legacy provider)"
regex = '''nvapi-[A-Za-z0-9_\-]{60,}'''
keywords = ["nvapi-"]

[[rules]]
id = "auth0-client-secret"
description = "Auth0 client secret"
regex = '''(?i)auth0[_\-.]?client[_\-.]?secret['"\s:=]+[A-Za-z0-9_\-]{32,}'''
keywords = ["auth0"]

[allowlist]
description = "Non-secret example and lockfile paths"
paths = [
  '''\.env\.example$''',
  '''\.env\..*\.example$''',
  '''pnpm-lock\.yaml$''',
  '''poetry\.lock$''',
]
# Placeholder values used in committed example files.
regexes = [
  '''REQUIRED_FROM_VAULT''',
  '''mock_[a-z_]+_key''',
  '''your_[a-z_]+_here''',
]
