services:
  - type: web
    name: socialai-backend
    env: python
    buildCommand: "pip install poetry && poetry install"
    startCommand: "python -m alembic upgrade head && python -m uvicorn services.identity_service.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_API_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: DEFAULT_LLM_MODEL
        value: meta/llama-3.1-70b-instruct
