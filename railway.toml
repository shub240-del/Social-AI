[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run as a release step so a bad migration fails the deploy
# instead of leaving half the replicas on the new code.
startCommand = "alembic upgrade head && gunicorn services.identity_service.main:app --worker-class services.identity_service.worker.SocialAIWorker --workers ${WEB_CONCURRENCY:-2} --bind 0.0.0.0:${PORT} --timeout 120 --graceful-timeout 30 --access-logfile - --error-logfile -"
healthcheckPath = "/readyz"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
