# Local development stack.
#
# This file previously declared redis, clickhouse and localstack services and
# mounted ./docker/postgres/init.sql, ./docker/redis/redis.conf and
# ./docker/clickhouse/init.sql. None of those files exist in the repository and
# no code in packages/ or services/ imports redis, clickhouse or boto3, so the
# stack could not start and would not have been used if it had. What remains is
# what the application actually talks to: Postgres, plus the API image itself.
#
#   docker compose up --build
#   -> API on http://127.0.0.1:8000, Postgres on 127.0.0.1:5432
#
# Migrations run automatically in the api service's entrypoint.

services:
  postgres:
    image: postgres:16-alpine
    container_name: socialai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socialai_dev}
      POSTGRES_USER: ${POSTGRES_USER:-socialai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialai_secret_dev_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-socialai_user} -d ${POSTGRES_DB:-socialai_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialai-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      PORT: 8000
      WEB_CONCURRENCY: 2
      # The app uses the asyncpg driver; alembic uses the sync psycopg2 one.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-socialai_user}:${POSTGRES_PASSWORD:-socialai_secret_dev_pass}@postgres:5432/${POSTGRES_DB:-socialai_dev}
      MIGRATION_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-socialai_user}:${POSTGRES_PASSWORD:-socialai_secret_dev_pass}@postgres:5432/${POSTGRES_DB:-socialai_dev}
      ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      FRONTEND_BASE_URL: http://127.0.0.1:3000
      # Development defaults: emails print to the container log and the LLM is
      # mocked. Set SAKANA_API_KEY and unset ALLOW_MOCK_LLM for real completions.
      EMAIL_BACKEND: console
      ALLOW_MOCK_LLM: "true"
      SAKANA_API_KEY: ${SAKANA_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    # $$PORT, not ${PORT}: compose interpolates ${...} from the *host* shell,
    # where PORT is unset, so the command rendered as "-b 0.0.0.0:" and gunicorn
    # could not bind. $$ escapes the substitution and lets the container's shell
    # read the values set under `environment:` above.
    command:
      - sh
      - -c
      - |
        alembic upgrade head
        exec gunicorn services.identity_service.main:app \
          -k services.identity_service.worker.SecureUvicornWorker \
          -w $$WEB_CONCURRENCY -b 0.0.0.0:$$PORT \
          --timeout 120 --graceful-timeout 30 --access-logfile -

volumes:
  postgres_data:
